<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aetheria // Carte Spatiale 3D</title>
  
  <!-- 1. Tailwind CSS (Styles Sci-Fi) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- 3. Babel pour lire le JSX dans le navigateur -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- 4. Three.js pour la 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-slate-950 text-cyan-400 font-mono m-0 p-0 overflow-hidden select-none">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const PLANETS_DATA = [
      { id: 'plan-1', name: 'Aethelgard Prime', sector: 'Sector Alpha-9', type: 'Terrestrial', radius: 3.2, distance: 18, speed: 0.008, color: '#3b82f6', atmosphereColor: '#60a5fa', hasRings: false, population: '8.4 Billion', atmosphere: 'Nitrogen-Oxygen (1.1 atm)', temperature: '18°C Avg', status: 'Online', governance: 'UEC Military HQ' },
      { id: 'plan-2', name: 'Kragos V', sector: 'Omega Void', type: 'Volcanic', radius: 2.5, distance: 30, speed: 0.005, color: '#ef4444', atmosphereColor: '#f97316', hasRings: true, ringColor: '#fb923c', population: '120,000 Outlaws', atmosphere: 'Sulfuric Acid', temperature: '420°C Avg', status: 'Hostile', governance: 'Iron Maw Syndicate' },
      { id: 'plan-3', name: 'Zephyrus Nebula', sector: 'Nebula IX', type: 'Gas Giant', radius: 5.0, distance: 45, speed: 0.003, color: '#8b5cf6', atmosphereColor: '#c084fc', hasRings: true, ringColor: '#e9d5ff', population: '45.2 Million', atmosphere: 'Hydrogen-Helium', temperature: '-140°C Upper', status: 'Monitored', governance: 'Aetherian Council' },
      { id: 'plan-4', name: 'Glacies-9', sector: 'Cygnus Reaches', type: 'Ice World', radius: 2.8, distance: 62, speed: 0.002, color: '#06b6d4', atmosphereColor: '#67e8f9', hasRings: false, population: '1.2 Million', atmosphere: 'Methane-Ice Thin Layer', temperature: '-195°C Avg', status: 'Research Facility', governance: 'CyberTech Science Corp' },
      { id: 'plan-5', name: 'Thalassa Alpha', sector: 'Sector Alpha-9', type: 'Oceanic', radius: 3.8, distance: 78, speed: 0.0015, color: '#0d9488', atmosphereColor: '#2dd4bf', hasRings: false, population: '620 Million', atmosphere: 'Dense Oxygen-Nitrogen', temperature: '24°C Global', status: 'Restricted Access', governance: 'UEC Deep Water Command' }
    ];

    function App() {
      const mountRef = useRef(null);
      const [selectedPlanet, setSelectedPlanet] = useState(PLANETS_DATA[0]);
      const [rotationSpeed, setRotationSpeed] = useState(1);
      const [showOrbits, setShowOrbits] = useState(true);

      const sceneRef = useRef(null);
      const cameraRef = useRef(null);
      const rendererRef = useRef(null);
      const planetsGroupRef = useRef([]);
      const orbitsGroupRef = useRef(null);
      const isDraggingRef = useRef(false);
      const previousMousePosition = useRef({ x: 0, y: 0 });
      const targetRotation = useRef({ x: 0.3, y: 0 });

      useEffect(() => {
        const mount = mountRef.current;
        if (!mount) return;

        const width = mount.clientWidth;
        const height = mount.clientHeight;

        // Scene
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030712, 0.002);
        sceneRef.current = scene;

        // Camera
        const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 2000);
        camera.position.set(0, 70, 140);
        camera.lookAt(0, 0, 0);
        cameraRef.current = camera;

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        mount.appendChild(renderer.domElement);
        rendererRef.current = renderer;

        // Lights
        const ambientLight = new THREE.AmbientLight(0x1a2436, 1.5);
        scene.add(ambientLight);
        const sunLight = new THREE.PointLight(0xfff5ea, 3.5, 500);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        // Stars
        const starsGeo = new THREE.BufferGeometry();
        const starCount = 3000;
        const posArray = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i++) {
          posArray[i] = (Math.random() - 0.5) * 1000;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMat = new THREE.PointsMaterial({ size: 1, color: 0x00f0ff });
        const starMesh = new THREE.Points(starsGeo, starsMat);
        scene.add(starMesh);

        // Central Sun
        const sunGeo = new THREE.SphereGeometry(7, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sunMesh);

        // Planets & Orbits
        const planetsGroup = [];
        const orbitsGroup = new THREE.Group();
        scene.add(orbitsGroup);
        orbitsGroupRef.current = orbitsGroup;

        PLANETS_DATA.forEach((pData) => {
          const pivot = new THREE.Group();
          scene.add(pivot);

          const pGeo = new THREE.SphereGeometry(pData.radius, 32, 32);
          const pMat = new THREE.MeshStandardMaterial({ color: pData.color, roughness: 0.5 });
          const mesh = new THREE.Mesh(pGeo, pMat);
          mesh.position.x = pData.distance;
          mesh.userData = { data: pData };
          pivot.add(mesh);

          if (pData.hasRings) {
            const ringGeo = new THREE.RingGeometry(pData.radius * 1.4, pData.radius * 2.2, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: pData.ringColor, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.rotation.x = Math.PI / 2.2;
            mesh.add(ringMesh);
          }

          // Orbit Line
          const curve = new THREE.EllipseCurve(0, 0, pData.distance, pData.distance, 0, 2 * Math.PI);
          const pts = curve.getPoints(100);
          const orbitGeo = new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(p.x, 0, p.y)));
          const orbitMat = new THREE.LineBasicMaterial({ color: pData.color, transparent: true, opacity: 0.2 });
          const orbitLine = new THREE.LineLoop(orbitGeo, orbitMat);
          orbitsGroup.add(orbitLine);

          planetsGroup.push({ pivot, mesh, speed: pData.speed });
        });

        planetsGroupRef.current = planetsGroup;

        // Animation Loop
        let animId;
        const animate = () => {
          animId = requestAnimationFrame(animate);

          planetsGroupRef.current.forEach(p => {
            p.pivot.rotation.y += p.speed * rotationSpeed;
            p.mesh.rotation.y += 0.01;
          });

          scene.rotation.y += (targetRotation.current.y - scene.rotation.y) * 0.05;
          scene.rotation.x += (targetRotation.current.x - scene.rotation.x) * 0.05;

          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          const w = mount.clientWidth;
          const h = mount.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animId);
          if (mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
        };
      }, [rotationSpeed]);

      useEffect(() => {
        if (orbitsGroupRef.current) orbitsGroupRef.current.visible = showOrbits;
      }, [showOrbits]);

      const handleCanvasClick = (e) => {
        const rect = mountRef.current.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(x, y), cameraRef.current);
        const meshes = planetsGroupRef.current.map(p => p.mesh);
        const intersects = raycaster.intersectObjects(meshes);

        if (intersects.length > 0) {
          setSelectedPlanet(intersects[0].object.userData.data);
        }
      };

      const handleMouseDown = (e) => {
        isDraggingRef.current = true;
        previousMousePosition.current = { x: e.clientX, y: e.clientY };
      };

      const handleMouseMove = (e) => {
        if (!isDraggingRef.current) return;
        const dx = e.clientX - previousMousePosition.current.x;
        const dy = e.clientY - previousMousePosition.current.y;
        targetRotation.current.y += dx * 0.005;
        targetRotation.current.x += dy * 0.005;
        previousMousePosition.current = { x: e.clientX, y: e.clientY };
      };

      return (
        <div className="relative w-screen h-screen">
          {/* Canvas 3D */}
          <div 
            ref={mountRef} 
            className="absolute inset-0 cursor-grab active:cursor-grabbing"
            onClick={handleCanvasClick}
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={() => isDraggingRef.current = false}
          />

          {/* HUD Top Bar */}
          <header className="absolute top-0 left-0 right-0 z-20 flex justify-between items-center px-6 py-4 bg-slate-900/80 border-b border-cyan-500/30 backdrop-blur-md">
            <div>
              <h1 className="text-xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                AETHERIA // SPACE MAP 3D
              </h1>
              <p className="text-xs text-slate-400">NAVIGATION SPATIALE INTERACTIVE</p>
            </div>
            <button 
              onClick={() => setShowOrbits(!showOrbits)}
              className="px-3 py-1.5 text-xs font-semibold rounded border border-cyan-400 bg-cyan-500/20 text-cyan-300 hover:bg-cyan-500/40"
            >
              ORBITES : {showOrbits ? 'VISIBLES' : 'MASQUÉES'}
            </button>
          </header>

          {/* Left Panel - Planet List */}
          <div className="absolute top-20 left-6 z-10 w-72 bg-slate-900/80 backdrop-blur-md p-4 rounded-xl border border-cyan-500/30 shadow-2xl space-y-2">
            <h2 className="text-xs font-bold text-cyan-300 border-b border-cyan-500/20 pb-2 mb-3">SYSTÈMES PLANÉTAIRES</h2>
            {PLANETS_DATA.map(p => (
              <div 
                key={p.id}
                onClick={() => setSelectedPlanet(p)}
                className={`p-2.5 rounded-lg border transition-all cursor-pointer flex items-center justify-between ${
                  selectedPlanet.id === p.id 
                    ? 'bg-cyan-500/20 border-cyan-400 text-white' 
                    : 'bg-slate-950/40 border-slate-800 text-slate-400 hover:border-cyan-500/40'
                }`}
              >
                <div className="flex items-center space-x-2">
                  <div className="w-3 h-3 rounded-full" style={{ backgroundColor: p.color }} />
                  <span className="text-xs font-bold">{p.name}</span>
                </div>
                <span className="text-[10px] text-slate-500">{p.type}</span>
              </div>
            ))}

            <div className="pt-3 border-t border-cyan-500/20">
              <label className="text-[11px] text-slate-400 flex justify-between mb-1">
                <span>VITESSE DE SIMULATION</span>
                <span className="text-cyan-400 font-bold">{rotationSpeed.toFixed(1)}x</span>
              </label>
              <input 
                type="range" min="0" max="5" step="0.1" 
                value={rotationSpeed} 
                onChange={(e) => setRotationSpeed(parseFloat(e.target.value))}
                className="w-full accent-cyan-400 bg-slate-950"
              />
            </div>
          </div>

          {/* Right Panel - Telemetry */}
          {selectedPlanet && (
            <div className="absolute top-20 right-6 z-10 w-80 bg-slate-900/85 backdrop-blur-md p-5 rounded-xl border border-cyan-500/40 shadow-2xl space-y-3">
              <div className="border-b border-cyan-500/30 pb-2">
                <span className="text-[10px] text-cyan-400 uppercase font-bold">{selectedPlanet.sector}</span>
                <h2 className="text-lg font-black text-white">{selectedPlanet.name}</h2>
              </div>

              <div className="grid grid-cols-2 gap-2 text-xs">
                <div className="bg-slate-950 p-2 rounded border border-slate-800">
                  <span className="text-[10px] text-slate-500 block">TYPE</span>
                  <span className="font-bold text-cyan-200">{selectedPlanet.type}</span>
                </div>
                <div className="bg-slate-950 p-2 rounded border border-slate-800">
                  <span className="text-[10px] text-slate-500 block">STATUT</span>
                  <span className="font-bold text-emerald-400">{selectedPlanet.status}</span>
                </div>
                <div className="bg-slate-950 p-2 rounded border border-slate-800">
                  <span className="text-[10px] text-slate-500 block">POPULATION</span>
                  <span className="font-bold text-cyan-200">{selectedPlanet.population}</span>
                </div>
                <div className="bg-slate-950 p-2 rounded border border-slate-800">
                  <span className="text-[10px] text-slate-500 block">TEMPÉRATURE</span>
                  <span className="font-bold text-amber-400">{selectedPlanet.temperature}</span>
                </div>
              </div>

              <div className="bg-slate-950 p-2.5 rounded border border-cyan-500/10 text-xs">
                <span className="text-slate-500 text-[10px] block font-semibold">ATMOSPHÈRE</span>
                <p className="text-slate-200">{selectedPlanet.atmosphere}</p>
              </div>

              <div className="bg-slate-950 p-2.5 rounded border border-cyan-500/10 text-xs">
                <span className="text-slate-500 text-[10px] block font-semibold">GOUVERNANCE</span>
                <p className="text-slate-200">{selectedPlanet.governance}</p>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
